# Runs the fund-manager jobs on GitHub's servers and publishes the site to GitHub Pages.
# Times are UTC (IST - 5:30). The on-time trigger is cron-job.org (two entries calling workflow_dispatch:
# hourly at :20 with job=timer, and 09:10 Mon-Fri with job=preopen). GitHub's own timer below is the backup.
name: Fund manager jobs

on:
  schedule:
    # Backup only: cron-job.org triggers the same two runs on time. GitHub's timer can be 30-60 min
    # late; a late run maps back to the slot it belongs to and skips if that slot is already done.
    - cron: "50 * * * *"     # every hour at :20 IST -> auto (hourly / close / us_close / weekly / monthly / refresh)
    - cron: "40 3 * * 1-5"   # preopen 09:10 IST, Mon-Fri
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run (auto = the right one for the current time)"
        required: true
        default: auto
        type: choice
        options: [auto, timer, preopen, hourly, decision, close, evening, us_close, weekly, monthly, refresh]

permissions:
  contents: write   # update the database stored as a release asset
  pages: write
  id-token: write

concurrency:
  group: fund-manager-jobs   # one run at a time so the database is never written twice at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Which job
        id: pick
        run: python .github/pick_job.py "${{ github.event.schedule }}" "${{ inputs.job }}" >> "$GITHUB_OUTPUT"

      - name: Restore database (latest saved state, else the bootstrap copy)
        run: |
          mkdir -p data
          if gh release download state -p market.db.gz -D data --clobber; then
            gunzip -f data/market.db.gz
          else
            gunzip -c bootstrap/market.db.gz > data/market.db
          fi
          gh release download state -p validation.json -D data --clobber || cp bootstrap/validation.json data/validation.json

      - name: Run job
        id: run
        env:
          TRIGGER: ${{ github.event_name }}
        run: python jobs/run.py "${{ steps.pick.outputs.job }}"

      - name: Save database
        if: steps.run.outputs.skipped != 'true'
        run: |
          gzip -kf data/market.db
          gh release view state >/dev/null 2>&1 || gh release create state --title "Database state" --notes "Saved automatically after every job. Do not delete." --latest=false
          gh release upload state data/market.db.gz data/validation.json --clobber

      - name: Keep the schedule alive (GitHub pauses schedules after 60 days without commits)
        if: steps.pick.outputs.job == 'weekly'
        run: |
          date -u +"%Y-%m-%dT%H:%MZ" > bootstrap/last_weekly_run.txt
          git config user.name "fund-manager-bot"
          git config user.email "fund-manager-bot@users.noreply.github.com"
          git add bootstrap/last_weekly_run.txt
          git commit -m "Weekly heartbeat" && git push || true

      - if: steps.run.outputs.skipped != 'true'
        uses: actions/configure-pages@v5
      - if: steps.run.outputs.skipped != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: steps.run.outputs.skipped != 'true'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub sometimes can't see a just-uploaded page bundle; wait and try once more.
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - if: steps.deploy.outcome == 'failure'
        id: deploy_retry
        uses: actions/deploy-pages@v4
